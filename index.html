<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bot Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-700 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-xl bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-2xl font-bold mb-4">Bot Admin</h1>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Admin password</label>
      <input id="pw" type="password" class="w-full px-3 py-2 border rounded" placeholder="admin123" />
      <div class="mt-2">
        <button id="loginBtn" class="px-4 py-2 bg-blue-600 text-white rounded">Login</button>
      </div>
    </div>

    <div id="main" class="hidden">
      <div class="mb-4">
        <button id="getBookmarklet" class="px-4 py-2 bg-green-600 text-white rounded">Get Bookmarklet</button>
      </div>

      <div id="bookmarkletBox" class="hidden mt-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Bookmarklet (copy the whole line, save as bookmark):</label>
        <textarea id="bookmarkletArea" rows="6" class="w-full p-2 border rounded font-mono text-xs"></textarea>
      </div>
    </div>
  </div>

  <script>
    // Simple login (password is admin123)
    document.getElementById('loginBtn').addEventListener('click', function () {
      const pw = document.getElementById('pw').value || '';
      if (pw === 'admin123') {
        document.getElementById('main').classList.remove('hidden');
        alert('Logged in');
      } else {
        alert('Wrong password');
      }
    });

    // Corrected working bookmarklet (single-line string for copying)
    const bookmarkletCode = `javascript:(function(){const API='https://qxevuatuoalgo.vercel.app/api';function getPrices(){const p=[];document.querySelectorAll('[data-close]').forEach(e=>{const v=parseFloat(e.getAttribute('data-close'));if(!isNaN(v))p.push(v)});if(p.length>=15) return p;const els=document.querySelectorAll('[class],[data-price],[data-close]');els.forEach(e=>{if(p.length>500) return;const cls=(e.className||'')+'';if(/price|close|ticker|rate/i.test(cls)||e.hasAttribute('data-price')){const txt=e.getAttribute('data-close')||e.getAttribute('data-price')||e.textContent||'';const v=parseFloat((txt+'').replace(/[^0-9.\-]/g,''));if(!isNaN(v))p.push(v)}});return p}function computeRSI(pr,period=14){if(!pr||pr.length<period+1) return null;let gains=0,losses=0;for(let i=pr.length-period;i<pr.length;i++){const diff=pr[i]-pr[i-1];if(diff>0) gains+=diff; else losses+=Math.abs(diff)}const avgGain=gains/period;const avgLoss=losses/period; if(avgLoss===0) return avgGain===0?50:100;const rs=avgGain/avgLoss;return 100-(100/(1+rs))}function findButton(dir){const callSelectors=['[class*=call]','[class*=up]','button[aria-label*=call]','button[aria-label*=up]'];const putSelectors=['[class*=put]','[class*=down]','button[aria-label*=put]','button[aria-label*=down]'];const sels=dir==='call'?callSelectors:putSelectors;for(const s of sels){const el=document.querySelector(s);if(el) return el}return null}function startBot(){if(document.getElementById('qbot_btn')) return;const btn=document.createElement('div');btn.id='qbot_btn';btn.innerText='Start';btn.style.cssText='position:fixed;bottom:20px;right:20px;z-index:999999;background:green;color:#fff;padding:12px 16px;border-radius:999px;cursor:pointer;font-weight:bold;box-shadow:0 6px 18px rgba(0,0,0,0.2)';document.body.appendChild(btn);let running=false,iv=null;btn.onclick=()=>{running=!running;if(running){btn.style.background='red';btn.innerText='Stop';iv=setInterval(()=>{try{const prices=getPrices();if(!prices||prices.length<15) return;const rsi=computeRSI(prices,14);if(rsi===null) return;let dir=null;if(rsi<30) dir='call'; else if(rsi>70) dir='put'; if(!dir) return;const b=findButton(dir);if(b&&typeof b.click==='function'){b.click()}}catch(e){console.error('qbot error',e)}},10000);}else{btn.style.background='green';btn.innerText='Start';clearInterval(iv);iv=null}}} (function init(){const stored=localStorage.getItem('k');const verify=(k)=>fetch(API+'/verify-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({licence_key:k})}).then(r=>r.json()).catch(e=>({valid:false}));if(!stored){const k=prompt('Key:');if(!k) return;verify(k).then(d=>{if(d&&d.valid){localStorage.setItem('k',k);startBot()}else alert('Invalid')})}else{verify(stored).then(d=>{if(d&&d.valid) startBot(); else {alert('Invalid stored key'); localStorage.removeItem('k')}})}})();`;

    document.getElementById('getBookmarklet').addEventListener('click', function () {
      document.getElementById('bookmarkletBox').classList.remove('hidden');
      document.getElementById('bookmarkletArea').value = bookmarkletCode;
    });
  </script>
</body>
</html>
`,
